services:
  postgres:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ops_console
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ${OC_POSTGRES_PASSWORD:-ops-console-local-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ops -d ops_console"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ops]

  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ops]

  app:
    build:
      context: ..
    restart: unless-stopped
    ports:
      - "80:8080"
    environment:
      DBW_ADDRESS: :8080
      DBW_ALLOWED_CIDRS: ${DBW_ALLOWED_CIDRS:-}
      DBW_ALLOWED_PORTS: ${DBW_ALLOWED_PORTS:-}
      DBW_ALLOWED_SUFFIXES: ${DBW_ALLOWED_SUFFIXES:-}
      DBW_QUERY_TIMEOUT: ${DBW_QUERY_TIMEOUT:-30s}
      DBW_PAGE_SIZE: ${DBW_PAGE_SIZE:-200}
      DBW_MAX_ROWS: ${DBW_MAX_ROWS:-10000}
      DBW_REGISTRY_PATH: /data/registry.db
      DBW_REGISTRY_SECRET: ${DBW_REGISTRY_SECRET:-}
      OC_DATABASE_URL: postgres://ops:${OC_POSTGRES_PASSWORD:-ops-console-local-password}@postgres:5432/ops_console?sslmode=disable
      OC_REDIS_URL: redis://redis:6379/0
      OC_CREDENTIAL_KEYS: ${OC_CREDENTIAL_KEYS:?OC_CREDENTIAL_KEYS is required}
      OC_ACTIVE_CREDENTIAL_KEY: ${OC_ACTIVE_CREDENTIAL_KEY:?OC_ACTIVE_CREDENTIAL_KEY is required}
      OC_COOKIE_SECURE: ${OC_COOKIE_SECURE:-true}
      OC_SESSION_TTL: ${OC_SESSION_TTL:-12h}
      OC_BOOTSTRAP_ADMIN_USER: ${OC_BOOTSTRAP_ADMIN_USER:-}
      OC_BOOTSTRAP_ADMIN_PASSWORD: ${OC_BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes:
      - app_data:/data
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [ops]

networks:
  ops:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  app_data:
