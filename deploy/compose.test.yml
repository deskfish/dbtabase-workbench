services:
  mysql:
    image: docker.m.daocloud.io/library/mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: test-root-only
      MYSQL_DATABASE: workbench_test
      MYSQL_USER: workbench
      MYSQL_PASSWORD: workbench-test
    ports: ["13306:3306"]
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, localhost, -ptest-root-only]
      interval: 3s
      timeout: 3s
      retries: 20
  postgres:
    image: docker.m.daocloud.io/library/postgres:17-alpine
    environment:
      POSTGRES_DB: workbench_test
      POSTGRES_USER: workbench
      POSTGRES_PASSWORD: workbench-test
    ports: ["15432:5432"]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U workbench -d workbench_test]
      interval: 3s
      timeout: 3s
      retries: 20
